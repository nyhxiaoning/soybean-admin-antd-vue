<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .container {
        display: grid;
        grid-template-columns: 2fr 1fr; /* 内容占2份，侧边栏占1份 */
        gap: 20px;
      }

      .content {
        background-color: #f0f0f0;
        padding: 20px;
      }

      .sidebar {
        background-color: #e0e0e0;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="content">
        <h2>文章内容</h2>
        <p>这是一篇文章的内容。</p>
      </div>
      <div class="sidebar">
        <h2>侧边栏</h2>
        <p>这是侧边栏的内容。</p>
      </div>
    </div>
  </body>
</html>
