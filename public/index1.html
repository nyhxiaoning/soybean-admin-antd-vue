<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      .container {
        display: grid;
        grid-template-columns: repeat(6, 1fr); /* 6列等宽 */
        gap: 20px;
      }

      .item {
        background-color: #d0d0d0;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="item">产品 1</div>
      <div class="item">产品 2</div>
      <div class="item">产品 3</div>
    </div>
  </body>
</html>
